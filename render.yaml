services:
  - type: web
    name: satellite-land-change-detection-tool
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_PAYLOAD_SIZE
        value: 15mb
      - key: CORS_ALLOWED_ORIGINS
        value: https://satellite-land-change-detection-too.vercel.app,http://localhost:5173
