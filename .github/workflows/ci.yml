name: PS08 Continuous Integration (CI)

on:
  push:
    branches: ['main', 'master', '**']
  pull_request:
    branches: ['main', 'master']

permissions:
  contents: read

jobs:
  build-and-test:
    name: Validate, Test & Build (Backend + Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 3. Install backend dependencies reproducibly
        working-directory: backend
        run: npm ci

      - name: 4. Install frontend dependencies reproducibly
        working-directory: frontend
        run: npm ci

      - name: 5. Run backend TypeScript check
        working-directory: backend
        run: npm run typecheck

      - name: 6. Run frontend TypeScript check
        working-directory: frontend
        run: npm run typecheck

      - name: 7. Run backend unit & API integration tests
        working-directory: backend
        run: npm test

      - name: 8. Run frontend component & workflow tests
        working-directory: frontend
        run: npm test

      - name: 9. Build backend production bundle
        working-directory: backend
        run: npm run build

      - name: 10. Build frontend production bundle
        working-directory: frontend
        run: npm run build
