name: Deploy Backend to Azure App Service (Manual OIDC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment name'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Required for Azure OpenID Connect (OIDC) federated token exchange
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy-azure:
    name: Build & Deploy PS08 Backend via Azure OIDC
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 3. Install backend dependencies & run verification tests
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm prune --omit=dev

      - name: 4. Package backend release artifact for Azure App Service
        working-directory: backend
        run: |
          zip -r ../ps08-backend-release.zip package.json package-lock.json dist sample_data node_modules

      - name: 5. Authenticate with Microsoft Entra ID using OpenID Connect (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 6. Deploy package to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ps08-backend-release.zip

      - name: 7. Verify deployed health endpoint
        if: ${{ vars.AZURE_WEBAPP_URL != '' }}
        run: |
          echo "Probing ${{ vars.AZURE_WEBAPP_URL }}/api/health ..."
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ vars.AZURE_WEBAPP_URL }}/api/health"
